<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>praise lock — unlock your phone through worship</title>
    <meta name="description"
        content="praise lock keeps your phone locked until you take a moment to worship. available on iOS and Android.">
    <link rel="stylesheet" href="style.css">

    <main class="page">
        <section class="hero">

            <!-- Left Column -->
            <div class="hero__content">
                <h1 class="hero__headline">
                    your phone is<br>

                <div class="hero__badges">
                    <a href="#" class="hero__badge" aria-label="Download on the App Store">
                        <img src="https://developer.apple.com/assets/elements/badges/download-on-the-app-store.svg"
                            alt="Download on the App Store">
                    </a>
                    <a href="#" class="hero__badge" aria-label="Get it on Google Play">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg"
                            alt="Get it on Google Play">
                    </a>
                </div>
            </div>

            <!-- Right Column — App Card with Phone Mockup -->
            <div class="hero__image">
                <div class="app-card">
                    <div class="app-card__phone">
                        <div class="app-card__screen">
                            <div class="app-card__screen-icon">
